name: Bug report
description: Report a reproducible installation, playback, tracking, or Companion problem.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Please include a minimal reproduction and reviewed diagnostics. Do not paste authentication codes, session files, tokens, signed media URLs, or private media.
  - type: input
    id: version
    attributes:
      label: Project version or commit
      placeholder: Package version or git commit
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Installation or package build
        - Companion interface
        - Media playback or TIDAL
        - Selected application audio
        - Sony earbud tracking
        - Optional motion tracker
        - Equalizer or output level
        - Connection or recovery
        - Diagnostics or another component
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Distribution, Plasma/session type, headphone model and firmware if known, relevant package versions, and tracker/receiver model when involved.
      placeholder: Arch or CachyOS; Plasma version; Wayland or X11; WF-1000XM5; PipeWire/WirePlumber/BudsLink versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the order of connections, source selection, and toggles. Use redacted paths or a shareable sample.
      placeholder: |
        1. Connect ...
        2. Open ...
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed behavior
      description: For spatial playback, state whether decoded objects were confirmed or the format is unknown. A service badge alone does not confirm rendering.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed diagnostic or verification output
      description: Run spatial-diagnostics, review the local file, and paste only relevant redacted sections. Include spatial-verify results when useful.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I reviewed the attached text and removed credentials, signed URLs, and private media.
          required: true
