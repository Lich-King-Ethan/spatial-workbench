# Reference for the private config generated by spatiald; do not replace your
# shared Omniphony config with this file. A package-installed bridge is required.
render:
  bridge_path: /usr/lib/orender/libharletty_bridge.so
  channel_render_mode: spatial
  auto_gain: true
  auto_gain_ceiling_db: -1.0
  use_loudness: false
  binaural:
    output_mode: binaural
    hrir_source: saf
    head_tracking:
      osc_address: ''
    reflections:
      enabled: false
    reverb:
      enabled: false
